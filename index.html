<html lang="ko">
<head>

<meta property="og:title" content="Studentgithub · 우리가 만든 과학 앱">
<meta property="og:description" content="학생들이 바이브코딩으로 만든 과학 시뮬레이터를 모아 서로 돌려 보고 평가합니다.">

<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --blue:#0066cc;--blue-h:#0071e3;--blue-dark:#2997ff;--tint:rgba(0,102,204,.07);
  --ink:#1d1d1f;--ink2:#333336;--muted:#6e6e73;--muted2:#86868b;
  --line:#e0e0e0;--soft:#f5f5f7;--pearl:#fafafc;
  --ok:#1d8a4e;--warn:#9a6b00;--bad:#b3261e;--green:#34c759;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:#fff;color:var(--ink);font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;font-size:17px;line-height:1.47;letter-spacing:-.022em;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--blue)}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.pad{padding-top:28px;padding-bottom:40px}
.narrow{max-width:760px}
[hidden]{display:none!important}

/* 상단 바 */
.nav{position:sticky;top:0;z-index:50;height:52px;background:rgba(255,255,255,.84);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.nav .in{max-width:1180px;margin:0 auto;height:100%;display:flex;align-items:center;gap:14px;padding:0 22px}
.logo{display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;font-weight:600;font-size:19px;letter-spacing:-.025em}
.logo img{width:28px;height:28px;display:block}
.logo .t{color:var(--blue)}
.nav .sp{flex:1}
.nav .nl{color:var(--ink);text-decoration:none;font-size:14px;opacity:.8}
.nav .nl:hover{opacity:1}
.who{display:flex;align-items:center;gap:8px;font-size:14px}
.who .me{color:var(--muted);white-space:nowrap}
.localbar{background:#fff8e1;color:#6b4e00;text-align:center;font-size:14px;padding:7px 12px;border-bottom:1px solid #f0dca0}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 22px;border-radius:980px;font-size:16px;font-weight:500;cursor:pointer;border:1px solid transparent;text-decoration:none;white-space:nowrap;background:transparent;color:var(--blue)}
.btn:hover{text-decoration:underline}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-h);text-decoration:none}
.btn.line{border-color:var(--line);color:var(--ink);background:#fff}
.btn.line:hover{border-color:#c7c7cc;text-decoration:none}
.btn.sm{min-height:34px;padding:0 14px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default;text-decoration:none}

/* 글자 */
.eyebrow{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,48px);line-height:1.08;font-weight:600;letter-spacing:-.03em;margin:0}
h2{font-size:clamp(22px,3vw,28px);line-height:1.15;font-weight:600;letter-spacing:-.025em;margin:0 0 14px}
h3{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0 0 10px}
.lead{font-size:clamp(17px,2.2vw,21px);color:var(--muted);margin:14px 0 0;line-height:1.4}
.lead2{font-size:16px;color:var(--muted);margin:0 0 18px;line-height:1.5}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.empty{color:var(--muted);text-align:center;padding:36px 0}
.back{display:inline-block;color:var(--blue);text-decoration:none;font-size:15px;margin:0 0 18px}
.back:hover{text-decoration:underline}

/* 첫 화면 */
.hero{background:var(--soft);text-align:center;padding:74px 22px 62px}
.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.07}
.hero .lead{max-width:640px;margin:18px auto 0}
.hero .cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:28px 0 0}
.hero .stat{margin:22px 0 0;font-size:14px;color:var(--muted)}
.hero .other{margin:18px 0 0;font-size:15px}
.hero .other a{display:inline-block;padding:8px 18px;border-radius:980px;border:1px solid var(--line);background:#fff;color:var(--blue);text-decoration:none;font-weight:600}
.hero .other a:hover{border-color:#c7c7cc}
.hero .stat b{color:var(--ink);font-weight:600}

/* 칩 */
.browse{padding:36px 0 64px}
.filters{padding:4px 0 18px;border-bottom:1px solid var(--line)}
.frow{display:flex;align-items:center;gap:12px;margin:0 0 10px;min-width:0}
.frow .fl{flex:none;width:46px;font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 1px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 14px;border-radius:980px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#c7c7cc}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .n{color:var(--muted2);margin-left:5px;font-size:12px}
.chip[aria-pressed="true"] .n{color:rgba(255,255,255,.82)}

/* 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin:26px 0 0}
.card{display:flex;flex-direction:column;background:var(--soft);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s ease}
.card:hover{transform:translateY(-3px)}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.thumb{aspect-ratio:16/10;background:#fff;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.tile{width:84px;height:84px;border-radius:20px;background:var(--soft);display:grid;place-items:center;font-size:38px;font-weight:600;color:var(--ink);letter-spacing:0}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:18px;line-height:1.3;margin:0}
.card .sum{font-size:15px;color:var(--muted);margin:0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0;font-size:12.5px}
.meta span{padding:3px 10px;border-radius:980px;background:#fff;color:var(--ink2)}
.card .by{margin:auto 0 0;padding-top:10px;font-size:13px;color:var(--muted2);display:flex;justify-content:space-between;gap:8px}
.notice{background:var(--soft);border-radius:18px;padding:34px 24px;text-align:center;margin:30px 0 0}
.notice b{font-size:19px}
.notice p{color:var(--muted);margin:8px 0 18px}

/* 검은 띠 */
.dark{background:#000;color:#f5f5f7;text-align:center;padding:72px 0}
.dark h2{font-size:clamp(28px,4vw,40px);margin:0 0 30px}
.dark .eyebrow{color:#a1a1a6}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:920px;margin:0 auto 26px;text-align:left}
.steps3 div{background:#1d1d1f;border-radius:18px;padding:24px}
.steps3 b{display:block;font-size:13px;color:var(--blue-dark);margin:0 0 8px}
.steps3 p{margin:0;font-size:16px;line-height:1.5;color:#f5f5f7}

/* 상세·무대 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft);border-radius:980px;padding:3px}
.seg button{min-height:32px;padding:0 16px;border:0;background:transparent;border-radius:980px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;font-weight:600}
.stage{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.stage iframe{display:block;width:100%;height:72vh;min-height:480px;border:0;background:#fff}
.stage.phone{border:0;background:var(--soft);display:flex;justify-content:center;padding:26px 0}
.stage.phone iframe{width:390px;max-width:calc(100% - 20px);height:760px;min-height:0;border:10px solid #1d1d1f;border-radius:46px}
.stage.small iframe{height:460px;min-height:0}
.stage .empty{padding:80px 0}
.note{font-size:14px;color:var(--muted);margin:12px 0 0}

/* 평가 목록 */
.rlist{list-style:none;margin:0 0 22px;padding:0}
.rlist li{padding:16px 0;border-bottom:1px solid var(--line)}
.rh{display:flex;gap:10px;align-items:baseline;margin:0 0 6px;font-size:14px;flex-wrap:wrap}
.rh span{color:var(--muted2);font-size:13px}
.rb{margin:4px 0 0;white-space:pre-wrap;font-size:16px}
.rb b{font-weight:600}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:980px;border:1px solid currentColor;white-space:nowrap}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.mute{color:var(--muted2)}.badge.bad{color:var(--bad)}

/* 입력 */
input[type=text],input[type=password],input[type=search],input[type=url],select,textarea{font:inherit;font-size:16px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);width:100%;letter-spacing:-.01em}
textarea{resize:vertical;min-height:64px;line-height:1.5}
textarea.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;letter-spacing:0;min-height:170px}
textarea.code::placeholder{font-family:'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic',sans-serif;font-size:14.5px;letter-spacing:-.01em}   /* 한글 안내는 고정폭 글꼴로 쓰지 않는다 */
input:focus,select:focus,textarea:focus,.drop:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.field{display:flex;flex-direction:column;gap:7px;margin:0 0 16px}
.field>label,.field>.lb{font-size:15px;font-weight:600}
.field small,.lb small{font-weight:400;color:var(--muted)}
.lb{font-size:15px;font-weight:600;margin:0 0 7px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:4px 0 18px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;border:1.5px dashed #c7c7cc;border-radius:18px;padding:18px;text-align:center;cursor:pointer;background:var(--pearl)}
.drop.ok{border-style:solid;border-color:var(--line);background:#fff}
.drop img{max-width:100%;max-height:200px;border-radius:11px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1.1fr .9fr 1.6fr;gap:10px}
.ticks,.radios{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.tick,.radios label{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:980px;font-size:15px;cursor:pointer;background:#fff}
.tick input,.radios input{accent-color:var(--blue);width:17px;height:17px;margin:0}
.tick:has(input:checked),.radios label:has(input:checked){border-color:var(--blue);background:var(--tint)}

/* 작업실 */
.ws{display:grid;grid-template-columns:250px 1fr;gap:34px;align-items:start;padding-top:26px;padding-bottom:50px}
.side{position:sticky;top:72px}
.hello{font-size:15px;color:var(--muted);margin:0 0 4px}
.hello b{color:var(--ink);font-size:20px;font-weight:600;display:block;letter-spacing:-.02em}
.prog{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.progt{font-size:13px;color:var(--muted);margin:0 0 16px}
.stepnav{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:2px}
.stepnav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;text-decoration:none;color:var(--ink);font-size:15.5px}
.stepnav a:hover{background:var(--soft)}
.stepnav a.on{background:var(--soft);font-weight:600}
.stepnav .dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;border:1.5px solid var(--line);color:var(--muted)}
.stepnav a.started .dot{border-color:var(--blue);color:var(--blue)}
.stepnav a.done .dot{background:var(--blue);border-color:var(--blue);color:#fff}
.stepnav small{display:block;color:var(--muted2);font-size:12.5px;font-weight:400}
.box{background:var(--soft);border-radius:18px;padding:22px 22px 8px;margin:0 0 18px}
.box h3{margin:0 0 14px}
.box .field textarea,.box .field input,.box .field select{background:#fff}
.stephead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.stephead h2{margin:0}
.limpick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:0 0 22px}
.intro div{background:var(--soft);border-radius:16px;padding:14px 18px}
.intro b{display:block;font-size:14px;font-weight:600;margin:0 0 4px}
.intro p{margin:0;font-size:16px;white-space:pre-wrap}
.movednote{margin:0 0 20px;padding:22px 20px}
.sidenote{margin:14px 0 0}
.kd{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--blue,#2f6fdb);border-radius:20px;padding:1px 8px;margin-right:6px;vertical-align:2px}
.limpick .btn{white-space:normal;text-align:left;line-height:1.4}
details.rf{margin:6px 0 0}
details.rf > summary{cursor:pointer;font-size:13px;color:var(--blue,#2f6fdb);font-weight:700}
details.rf dl.kv{margin:6px 0 0}
.vlist{list-style:none;padding:0;margin:0}
.vlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vlist li .vi{flex:1 1 260px;min-width:0}
.vlist li .vi b{font-size:16px}
.vlist li .vi span{display:block;font-size:13px;color:var(--muted)}
.rform{background:var(--soft);border-radius:18px;padding:20px 20px 6px;margin:18px 0 0}
.rform .rq{background:#fff;border-radius:12px;padding:12px 14px;margin:0 0 10px}
.rform .rq p{margin:0 0 8px;font-size:15px}
.rform .rq .radios{margin:0 0 8px}

/* 관리 */
.ah{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px;gap:12px;flex-wrap:wrap}
.atabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 0 12px;margin:0 0 18px}
.atabs button{min-height:34px;padding:0 14px;border-radius:980px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px}
.atabs button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable th,.ptable td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ptable th{font-size:12.5px;color:var(--muted);font-weight:600}
.ptable td.c{text-align:center}
.ptable tr.row{cursor:pointer}
.ptable tr.row:hover td{background:var(--pearl)}
.ok1{color:var(--ok);font-weight:700}.st1{color:var(--blue)}
.tscroll{overflow-x:auto}
.alist{list-style:none;padding:0;margin:0}
.alist li{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.alist .ai{flex:1 1 320px;min-width:0}
.alist .ai b{font-size:16px}
.alist .ai span{display:block;font-size:13px;color:var(--muted);margin:3px 0 0}
.alist .ai p{margin:6px 0 0;font-size:15px}
.alist .ab{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14.5px;margin:0 0 12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap}
.sform{background:var(--soft);border-radius:18px;padding:20px;margin:0 0 20px;max-width:720px}

/* 모달·알림 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:90;padding:16px}
.modal .box2{position:relative;background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:28px 24px 24px}
.modal .box2.wide{max-width:1100px}
.modal .box2 h3{font-size:22px;margin:0 0 8px}
.modal .x{position:absolute;top:10px;right:12px;width:36px;height:36px;border:0;background:var(--soft);border-radius:50%;font-size:20px;cursor:pointer;line-height:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;z-index:100;max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad)}

@media (max-width:860px){
  .ws{grid-template-columns:1fr;gap:18px}
  .side{position:static}
  .stepnav{flex-direction:row;overflow-x:auto;gap:4px}
  .stepnav a{flex-direction:column;gap:4px;padding:8px 10px;font-size:13px;text-align:center;min-width:76px}
  .stepnav small{display:none}
}
@media (max-width:760px){
  .steps3{grid-template-columns:1fr}
  .hero{padding:52px 18px 44px}
  .wrap{padding:0 16px}
  .nav .in{padding:0 16px;gap:10px}
  .nav .nl,.who .me{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .stage iframe{height:64vh}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ .card{transition:none} .card:hover{transform:none} }
</style>
</head>

function captureFrom(frame, timeout) {

    const fin = v => { if (done) return; done = true; removeEventListener('message', on); clearTimeout(t); res(v); };
    const on = e => { if (e.source !== frame.contentWindow || !e.data || e.data.sgh !== 'cap-res' || e.data.id !== id) return; const u = String(e.data.url || ''); fin(e.data.ok && /^data:image\/jpeg;base64,/.test(u) && u.length < 390000 ? u : null); };

async function autoThumb(html) {                       // 미리보기를 안 눌렀을 때: 화면 밖(투명)에서 1100×700 으로 잠깐 돌려 찍는다
  const host = document.createElement('div');
  host.setAttribute('aria-hidden', 'true'); host.style.cssText = 'position:fixed;left:0;top:0;width:1100px;height:700px;opacity:.01;pointer-events:none;z-index:-1;overflow:hidden';
  document.body.appendChild(host);
  try {
    const f = runIn(host, html, '대표 화면 만드는 중', true); f.style.cssText = 'width:1100px;height:700px;border:0;display:block'; f.tabIndex = -1;
    await Promise.race([new Promise(r => f.addEventListener('load', r, { once: true })), wait(5000)]);
    await wait(1800);

}
function extractHtml(raw) {
  if (!raw) return null;
  raw = raw.replace(/^```[a-z]*\s*$/gim, '');
  let s = raw.search(/<!doctype/i); if (s < 0) s = raw.search(/<html[\s>]/i);
  const e = raw.toLowerCase().lastIndexOf('</html>');
  if (s >= 0 && e > s) return raw.slice(s, e + 7);
  if (/<[a-z!][\s\S]*>/i.test(raw)) return raw.trim();
  return null;
}
async function imageToThumb(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const sc = Math.min(1, 640 / img.naturalWidth), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    let d = c.toDataURL('image/webp', .8);
    if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', .82);
    if (d.length > 380000) d = c.toDataURL('image/jpeg', .6);
    return d.length > 390000 ? null : d;
  } finally { URL.revokeObjectURL(url); }
}

async function rpc(fn, args) {
  const r = await fetch(SB.url + '/rest/v1/rpc/' + fn, { method: 'POST', body: JSON.stringify(args || {}),
    headers: { apikey: SB.key, Authorization: 'Bearer ' + SB.key, 'Content-Type': 'application/json' } });
  if (!r.ok) {
    let m = '', code = '', hint = '';
    try { const j = await r.json(); m = j.message || ''; code = j.code || ''; hint = j.hint || ''; } catch (e) {}
    const err = new Error(m || ('서버 응답 ' + r.status)); err.status = r.status; err.code = code; err.hint = hint; throw err;
  }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [page, arg] = h.split('/');
  const next = ['w', 'in', 'me', 'admin'].includes(page) ? page : 'list';
  if (S.page === 'list' && next !== 'list') S.listY = scrollY;
  const back = S.page && S.page !== 'list' && next === 'list';
  S.page = next; view.onclick = null; view.oninput = null; view.onchange = null; view.onpaste = null;
  if (next === 'w') return viewWork(arg);
  if (next === 'in') return viewEnter();
  if (next === 'me') return viewMe(arg);
  if (next === 'admin') return viewAdmin();
  return viewList(back);
}

function reviewForm(box, workId, after) {
  box.innerHTML = `<form class="rform" autocomplete="off">
    <h3>이 앱 평가하기</h3>
    ${D.reviewQs.map(q => `<div class="rq"><p>${esc(q.t)}</p>
      <div class="radios"><label><input type="radio" name="${q.id}" value="ok" required> 👍 그렇다</label><label><input type="radio" name="${q.id}" value="no"> 🤔 고칠 곳이 있다</label></div>
      <input type="text" name="${q.id}_why" maxlength="150" placeholder="그렇게 판단한 까닭 (무엇을 조작해 보았나)"></div>`).join('')}
    <div class="field"><label>칭찬 한 가지 <em style="color:var(--bad);font-style:normal">*</em></label><textarea name="praise" maxlength="300" rows="2" required></textarea></div>
    <div class="field"><label>고치면 더 좋을 한 가지</label><textarea name="suggest" maxlength="300" rows="2"></textarea></div>
    <p class="hint" style="margin:0 0 12px">평가는 이름 없이 「친구」로 보입니다. 친구가 기분 좋게 고칠 수 있게, 까닭을 들어 써 주세요.</p>
    <p style="margin:0 0 14px"><button class="btn primary" type="submit">평가 보내기</button></p></form>`;
  const f = box.querySelector('form');
  f.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(f), checks = {};
    for (const q of D.reviewQs) { const v = fd.get(q.id); if (!v) { toast('세 질문에 모두 답해 주세요.', true); return; } checks[q.id] = v; checks[q.id + '_why'] = String(fd.get(q.id + '_why') || '').trim(); }
    const b = f.querySelector('button[type=submit]'); b.disabled = true;
    try { await API.reviewSave(S.tok, workId, checks, String(fd.get('praise') || ''), String(fd.get('suggest') || '')); toast('평가를 보냈습니다. 고마워요!'); f.reset(); if (after) after(); await loadMe(); }
    catch (err) { if (err.hint === 'login') return relogin(); toast(err.message, true); }
    finally { b.disabled = false; }
  };
}

/* ════════ 3. 들어가기 ════════ */
function viewEnter() {

  (async () => {
    await loadTask();
    if (S.notReady) { $('#enterBox').innerHTML = notReadyBox(); return; }
    if (S.me) { $('#enterBox').innerHTML = `<div class="notice" style="margin:0"><b>학번 ${esc(S.me.student.sid)}(으)로 들어와 있습니다.</b><p>다른 학번으로 들어가려면 먼저 나가기를 누르세요.</p><a class="btn primary" href="#/me">내 작업실</a></div>`; return; }

      <p class="hint" style="margin:-4px 0 18px">다음에도 학번만 넣으면 하던 곳부터 이어집니다.</p>
      <button class="btn primary" type="submit">들어가기</button>
      <p class="hint" id="eerr" style="color:var(--bad);margin:14px 0 0"></p></form>`;
    $('#ef').onsubmit = async e => {
      e.preventDefault();

      $('#eerr').textContent = '';
      const b = $('#ef button'); b.disabled = true;
      try {
        const r = await API.enter(sid, nick);
        S.tok = r.token; store(TOKK, r.token);
        await loadMe();
        toast(r.is_new ? `반가워요! 학번 ${sid} — 자리가 만들어졌습니다.` : `돌아온 걸 환영해요! 하던 곳부터 이어 갑니다.`);
        location.hash = '#/me';
      } catch (err) {
        if (err.needNick) { $('#nickRow').style.display = ''; $('#nick').focus(); $('#eerr').textContent = '선생님이 서버를 바꾸기 전이라, 이번에만 처음에 쓴 별명도 넣어 주세요.'; }
        else $('#eerr').textContent = err.message;
      }
      finally { b.disabled = false; }

  })();

/* ════════ 4. 내 모델 ════════
   고치기·만들기·질문에 답하기·내 생각 쓰기는 수업 페이지에서 한다(2026-10-12).
   여기서는 ① 내 모델을 소개와 함께 올리고 ② 친구 모델을 서로 평가한다. */
const lessonUrl = () => (S.task && S.task.lesson_url) || D.lesson || '';
function stepDone(id) {
  if (!S.me) return false;
  if (id === 'submit') return (S.me.works || []).length > 0;
  if (id === 'review') return (S.me.gave || []).length >= 2;
  return false;
}
function stepStarted(id) { return id === 'review' && (S.me.gave || []).length > 0; }
function drawStepNav() {
  const ul = $('#stepnav'); if (!ul || !S.me) return;
  const cur = S.page === 'me' ? S.step : '';
  ul.innerHTML = STEPS.map((s, i) => { const dn = stepDone(s.id), st = stepStarted(s.id);
    return `<li><a href="#/me/${s.id}" class="${cur === s.id ? 'on' : ''} ${dn ? 'done' : st ? 'started' : ''}"><span class="dot">${dn ? '✓' : i + 1}</span><span>${s.t}<small>${s.s}</small></span></a></li>`; }).join('');
  const n = STEPS.filter(s => stepDone(s.id)).length;
  $('#progi').style.width = Math.round(n / STEPS.length * 100) + '%';
  $('#progt').textContent = `${STEPS.length}단계 중 ${n}단계 마침`;
}
async function viewMe(step) {
  document.title = U.mine + ' · Studentgithub';
  view.innerHTML = `<div class="wrap"><p class="empty">불러오는 중입니다…</p></div>`;
  await loadTask();
  if (S.notReady) { view.innerHTML = `<div class="wrap pad narrow">${notReadyBox()}</div>`; return; }
  if (!S.tok) { location.hash = '#/in'; return; }
  if (!S.me) { try { await loadMe(); } catch (e) { view.innerHTML = `<div class="wrap pad"><p class="empty">불러오지 못했습니다. (${esc(e.message)})</p></div>`; return; } }
  if (!S.me) { location.hash = '#/in'; return; }
  if (MOVED[step]) { S.moved = MOVED[step]; location.replace('#/me/submit'); return; }   // 옛 주소 → 수업 페이지로 옮겼다고 알림
  if (!STEPS.some(s => s.id === step)) { location.replace('#/me/submit'); return; }
  S.step = step;
  const me = S.me.student, lesson = lessonUrl();
  view.innerHTML = `<div class="wrap ws">
    <aside class="side">
      <p class="hello">안녕하세요<b>${esc(me.sid)}</b></p>
      <p class="hint" style="margin:0">${esc(clsName(me.cls))}${me.cls ? ' · ' : ''}${esc(D.title)}</p>
      <div class="prog"><i id="progi"></i></div><p class="progt" id="progt"></p>
      <ul class="stepnav" id="stepnav"></ul>
      ${lesson ? `<a class="btn line sm" href="${esc(lesson)}" target="_blank" rel="noopener">수업 페이지 열기 ↗</a>` : ''}
      <p class="hint sidenote">${U.side}</p>
      <p class="hint sidenote"><a href="${otherTask.href}">${otherTask.key === 'boyle' ? '🔬' : '🧪'} ${esc(otherTask.name)} ›</a></p>
    </aside>
    <section id="panel"></section></div>`;
  drawStepNav();
  const idx = STEPS.findIndex(s => s.id === step);
  $('#panel').innerHTML = `<div class="stephead"><div><p class="eyebrow" style="margin:0 0 4px">${idx + 1}단계</p><h2>${STEPS[idx].t}</h2></div></div>`;
  const body = document.createElement('div'); $('#panel').appendChild(body);
  await ({ submit: panelSubmit, review: panelReview })[step](body);
}

/* ── 모델 소개 보이기 ── */
const introOf = w => { const r = (w && w.reflect) || {}; return { summary: (w && w.summary) || '', how: r.how || '', lim: r.lim || '' }; };
function introHTML(o) {
  const rows = D.intro.map(q => [q.k, o[q.id]]).filter(x => String(x[1] || '').trim());
  return rows.length ? `<dl class="kv">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '';
}
function introCards(it) {                                   // 작품 보기 — 무대 위에 「이렇게 써 보세요」·「한계」
  if (!it || !(it.how || it.lim)) return '';
  return `<div class="intro">${it.how ? `<div><b>🕹 이렇게 써 보세요</b><p>${esc(it.how)}</p></div>` : ''}${it.lim ? `<div><b>🧩 ${esc(U.limLabel)}</b><p>${esc(it.lim)}</p></div>` : ''}</div>`;
}
const hasOld = rf => !!rf && D.oldReflect.some(q => String(rf[q.id] || '').trim());
function oldHTML(rf) { return hasOld(rf) ? `<dl class="kv">${D.oldReflect.filter(q => String(rf[q.id] || '').trim()).map(q => `<dt>${esc(q.t)}</dt><dd>${esc(rf[q.id])}</dd>`).join('')}</dl>` : ''; }
function verDetails(w, open) {
  const a = introHTML(introOf(w)), b = oldHTML(w.reflect || {});
  return (a ? `<details class="rf"${open ? ' open' : ''}><summary>${esc(U.noun)} 소개</summary>${a}</details>` : '') +
    (b ? `<details class="rf"${open ? ' open' : ''}><summary>이번 판 돌아보기 (10-12 전에 쓴 것)</summary>${b}</details>` : '');
}
/* 수업 페이지(같은 주소·같은 기기)에 적어 둔 것을 빈 칸에 미리 넣는다 — 같은 것을 두 번 쓰지 않게 */
function lessonGet(k) { try { return JSON.parse(localStorage.getItem('gasvibe:' + k) || 'null'); } catch (e) { return null; } }
function lessonPre(kind) {
  if (TASK !== 'gas') return {};
  const mk = lessonGet('mk') || {};
  const picked = D.limits.filter((_, i) => lessonGet('lim:lm' + (i + 1)) === true).map(t => t + '.').join(' ');
  return { title: kind === 'final' ? String(mk.appName || '').trim() : '', lim: (kind === 'final' && String(mk.limits || '').trim()) || picked };
}

/* ── ① 내 모델 올리기 ── */

      <div class="field"><textarea id="fsrc" class="code" placeholder="수업 페이지 실행실의 📋 내 코드 복사, 또는 제미나이 캔버스의 공유 → 콘텐츠 복사로 복사한 코드를 붙여넣으세요 (설명 글이 섞여도 코드만 골라 냅니다)"></textarea></div>

      <div class="stage small" id="fstage" hidden></div>

      <div class="drop" id="fthumb" tabindex="0"><span class="hint">올릴 때 앱 화면으로 자동으로 만들어요 · 바꾸려면 눌러서 그림 고르기 또는 Ctrl+V</span></div><input type="file" id="fimg" accept="image/*" hidden>

      <label class="check" style="margin-top:16px"><input type="checkbox" id="fpriv"> 앱 안에 내 실명·사진·연락처가 없습니다.</label>

      <div class="acts">${statusBadge(w.status)}<button class="btn line sm" data-see="${w.id}">돌려 보기</button><button class="btn line sm" data-copyv="${w.id}">코드 복사</button>${w.status === 'public' ? `<a class="btn sm" href="#/w/${w.id}">전시관에서 ›</a>` : ''}</div></li>`).join('') : '<li class="hint">아직 올린 판이 없습니다.</li>'}</ul>`;
  const sent = new Set(works.map(w => (w.reflect || {}).kind));
  const openUps = D.uploads.filter(u => u.stage <= OPEN());

  const kindTitle = id => (D.uploads.find(x => x.id === id) || D.uploads[0]).t;
  $('#ftitle').value = dr.title || kindTitle($('#fkind').value);
  if (dr.html) $('#fsrc').value = dr.html;
  D.intro.forEach(q => { $('#fi-' + q.id).value = dr[q.id] || ''; });
  const pre = {};                                          // 미리 넣은 글 — 학생이 고쳤으면 다시 덮지 않는다
  function fill() {
    const kind = $('#fkind').value, p = lessonPre(kind);
    D.intro.forEach(q => { $('#fi-' + q.id).placeholder = typeof q.ph === 'string' ? q.ph : (q.ph[kind] || q.ph.m1); });
    const ti = $('#ftitle'), all = D.uploads.map(u => u.t);
    if (!ti.value.trim() || all.includes(ti.value.trim()) || ti.value === pre.title) { ti.value = p.title || kindTitle(kind); pre.title = ti.value; }
    const li = $('#fi-lim');
    if (p.lim && (!li.value.trim() || li.value === pre.lim)) { li.value = p.lim; pre.lim = p.lim; }
  }
  fill();
  $('#fkind').onchange = () => { fill(); keep(); };
  const introNow = () => Object.fromEntries(D.intro.map(q => [q.id, $('#fi-' + q.id).value.trim()]));
  let thumb = null, thumbAuto = false, thumbBusy = 0;
  const size = () => { const h = extractHtml($('#fsrc').value); $('#fsize').textContent = h ? `${Math.round(bytes(h) / 1024)}KB` : ''; };
  size();
  const keep = () => store('sgh:draft:' + TASK, { html: $('#fsrc').value, title: $('#ftitle').value, kind: $('#fkind').value, ...introNow() });
  root.addEventListener('input', e => { if (['fsrc', 'ftitle'].includes(e.target.id) || e.target.id.startsWith('fi-')) { keep(); size(); }
    if (e.target.id === 'fsrc') { thumbBusy++; if (thumbAuto) showThumb(null); $('#fsnap').hidden = true; } });          // 코드를 고치면 자동으로 만든 그림은 지운다
  const showThumb = (url, auto) => { thumb = url; thumbAuto = !!auto;
    if (!url) { $('#fthumb').className = 'drop'; $('#fthumb').innerHTML = '<span class="hint">올릴 때 앱 화면으로 자동으로 만들어요 · 바꾸려면 눌러서 그림 고르기 또는 Ctrl+V</span>'; return; }
    $('#fthumb').className = 'drop ok'; $('#fthumb').innerHTML = `<img src="${url}" alt="대표 화면">` + (auto ? '<span class="hint">앱 화면으로 자동으로 만든 대표 화면 — 바꾸려면 캡처를 붙여 넣거나 「📸 지금 화면을」을 누르세요</span>' : ''); };
  const setThumb = async blob => { const d = await imageToThumb(blob); if (!d) return toast('그림이 너무 큽니다.', true); showThumb(d, false); };
  // 앱 화면으로 대표 화면 만들기 — 직접 고른 그림(캡처)이 있으면 건드리지 않는다
  const snapFrom = async frame => {                               // 「📸 지금 화면을」 — 미리보기 틀에서 지금 모습 그대로
    const my = ++thumbBusy, u = await captureFrom(frame, 7000);
    if (my !== thumbBusy) return;                                   // 그 사이 코드를 고쳤거나 다시 눌렀다
    if (u) { showThumb(u, false); toast('지금 화면을 대표 화면으로 정했습니다.'); }
    else toast('이 앱 화면은 그림으로 만들지 못했습니다. 캡처해서 붙여 넣어 주세요.', true);
  };
  const snapAuto = async h => {                                   // 미리보기를 누르면 뒤에서 저절로 — 직접 고른 그림이 있으면 건드리지 않는다
    const my = ++thumbBusy, u = await autoThumb(h);
    if (my !== thumbBusy) return;
    if (u && (!thumb || thumbAuto)) showThumb(u, true);
  };
  $('#fthumb').onclick = () => $('#fimg').click();
  $('#fimg').onchange = e => { const f = e.target.files[0]; if (f) setThumb(f); };
  root.addEventListener('paste', e => { const it = [...(e.clipboardData || {}).items || []].find(i => i.type.startsWith('image/')); if (it && (document.activeElement === $('#fthumb') || e.target.closest('#fthumb'))) { e.preventDefault(); setThumb(it.getAsFile()); } });
  $('#ffile').onchange = async e => { const f = e.target.files[0]; if (!f) return; if (f.size > MAX_HTML) return toast('파일이 2MB보다 큽니다.', true); $('#fsrc').value = await f.text(); keep(); size(); toast('파일을 불러왔습니다.'); };

/* 10-12 전 작업실 기록(고치기 기록·만들기·점검표·자기평가) — 지금은 수업 페이지에서 쓰지만, 쓴 것이 있으면 그대로 보여 준다 */
function flatRows(o, pre, out) {
  if (o == null) return out;
  if (typeof o !== 'object') { if (String(o).trim() && !/(^|\.)done$/.test(pre)) out.push([pre, String(o)]); return out; }
  Object.entries(o).forEach(([k, v]) => flatRows(v, pre ? pre + '.' + k : k, out)); return out;
}
function noteView(step, d) {
  if (!d) return '<p class="hint">없음</p>';
  const row = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : '';
  let h = '';
  if (step === 'fix') h = D.missions.map(m => { const x = d[m.id] || {}; const f = (x.found || []).map((v, i) => v ? CIRC[i] : '').join('');
    return row(m.name + ' 찾음', f) + row('고친 방법', { ai: 'ⓐ 준비된 문장', self: 'ⓑ 내 말로', both: '둘 다' }[x.how] || '') + row('기억에 남는 잘못', x.pick !== undefined && x.pick !== '' ? '잘못 ' + CIRC[+x.pick] : '') + row('보인 것', x.see) + row('왜 틀렸나', x.why) + row('어떻게 고쳤나', x.fix) + row('기다리며 한 예상', x.guess); }).join('') + row('AI가 엉뚱하게', d.aiWrong);
  else h = flatRows(d, '', []).map(([k, v]) => row(k, v)).join('');
  return `<dl class="kv">${h || '<dt></dt><dd class="hint">쓴 내용이 없습니다</dd>'}</dl>`;
}

async function exportCsv() {
  let rows; try { rows = await API.aExport(AP(), TASK); } catch (e) { return aFail(e); }
  const q = v => { const s = String(v == null ? '' : v).replace(/\r?\n/g, ' '); return /[",]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const vk = w => `${w.v}판${kindOf(w.reflect) ? '(' + kindOf(w.reflect).k + ')' : ''}`;
  const anyOld = rows.some(r => (r.works || []).some(w => hasOld(w.reflect)));
  const anyFix = rows.some(r => r.notes && r.notes.fix);
  const head = ['학번', '반', '올린 것(판별)', ...D.intro.map(x => U.noun + ' 소개: ' + x.k + '(판별)'), '판 수', '최근 상태', '받은 평가 수', '받은 칭찬·제안'];
  if (anyOld) head.push(...D.oldReflect.map(x => '옛 돌아보기: ' + x.k + '(판별)'));
  if (anyFix) { D.missions.forEach(m => head.push('옛 고치기 기록: ' + m.name + ' 찾은 잘못', m.name + ' 보인 것', m.name + ' 왜 틀렸나', m.name + ' 어떻게 고쳤나')); head.push('옛 고치기 기록: AI가 엉뚱하게'); }
  const out = [head.map(q).join(',')];
  rows.forEach(r => {
    const ws = r.works || [];
    const line = [r.sid, clsName(r.cls), ws.map(vk).join(' / '),
      ...D.intro.map(x => ws.map(w => [vk(w), introOf(w)[x.id]]).filter(p => String(p[1] || '').trim()).map(p => p[0] + ': ' + p[1]).join(' / ')),
      ws.length, ws.slice(-1).map(w => ({ public: '공개', pending: '확인 대기', hidden: '내려감' }[w.status])).join(''),
      (r.got || []).length, (r.got || []).map(g => `${g.from}: ${g.praise}${g.suggest ? ' / 제안: ' + g.suggest : ''}`).join(' // ')];
    if (anyOld) line.push(...D.oldReflect.map(x => ws.filter(w => String((w.reflect || {})[x.id] || '').trim()).map(w => vk(w) + ': ' + w.reflect[x.id]).join(' / ')));
    if (anyFix) { const fx = (r.notes || {}).fix || {}; D.missions.forEach(m => { const x = fx[m.id] || {}; line.push((x.found || []).map((v, i) => v ? CIRC[i] : '').join(''), x.see, x.why, x.fix); }); line.push(fx.aiWrong); }
    out.push(line.map(q).join(','));
  });
  download(`Studentgithub_${TASK}_${new Date().toISOString().slice(0, 10)}.csv`, '﻿' + out.join('\r\n'), 'text/csv;charset=utf-8');
}

  box.innerHTML = `<div class="abar" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 10px"><p class="hint" style="margin:0">확인 대기 ${pend.length} · 모두 ${rows.length}</p>${pend.length ? `<button class="btn primary sm" data-allpub>확인 대기 모두 공개</button>` : ''}</div>
    <ul class="alist">${rows.length ? rows.map(r => `<li><div class="ai"><b>${kindOf(r.reflect) ? `<span class="kd">${esc(kindOf(r.reflect).k)}</span>` : ''}${esc(r.title)} · ${r.v}판</b><span>학번 ${esc(r.sid)} · ${ago(r.ts)}</span>${verDetails(r)}</div>
      <div class="ab">${statusBadge(r.status)}<button class="btn line sm" data-aw="${r.id}">돌려 보기</button>${r.status !== 'public' ? `<button class="btn primary sm" data-st="public" data-id="${r.id}">공개</button>` : ''}${r.status !== 'hidden' ? `<button class="btn sm danger" data-st="hidden" data-id="${r.id}">내리기</button>` : ''}</div></li>`).join('') : '<li class="empty">아직 올라온 앱이 없습니다.</li>'}</ul>`;
  box.onclick = async e => {
    const aw = e.target.closest('[data-aw]'); if (aw) { try { const w = await API.aWork(AP(), aw.dataset.aw); const mm = modal(`<h3>${esc(w.title)} · ${w.v}판 <span class="hint">학번 ${esc(w.sid)}</span></h3><div class="stage" id="mst"></div>`, true); runIn($('#mst', mm.box), w.html, w.title); } catch (err) { aFail(err); } return; }
    const st = e.target.closest('[data-st]'); if (st) { try { await API.aStatus(AP(), [st.dataset.id], st.dataset.st); toast(st.dataset.st === 'public' ? '공개했습니다.' : '내렸습니다.'); aWorks(box); } catch (err) { aFail(err); } return; }
    if (e.target.closest('[data-allpub]')) { try { const n = await API.aStatus(AP(), pend.map(r => r.id), 'public'); toast(n + '개를 공개했습니다.'); aWorks(box); } catch (err) { aFail(err); } }
  };
}
async function aReviews(box) {
  box.innerHTML = '<p class="empty">불러오는 중입니다…</p>';
  let rows; try { rows = await API.aReviews(AP(), TASK); } catch (e) { return aFail(e); }
  box.innerHTML = `<p class="hint" style="margin:0 0 10px">서로 평가 ${rows.length}개. 부적절한 평가는 숨기면 학생들에게 보이지 않습니다.</p>
    <ul class="alist">${rows.length ? rows.map(r => `<li><div class="ai"><b>${esc(r.reviewer)} → ${esc(r.author)} ${r.v}판</b><span>${ago(r.ts)}</span><p>${checkBadges(r.checks)}</p><p><b>칭찬</b> ${esc(r.praise)}${r.suggest ? `<br><b>제안</b> ${esc(r.suggest)}` : ''}</p></div>
      <div class="ab">${r.hidden ? '<span class="badge mute">숨김</span>' : ''}<button class="btn line sm" data-hide="${r.id}" data-h="${r.hidden ? 0 : 1}">${r.hidden ? '다시 보이기' : '숨기기'}</button></div></li>`).join('') : '<li class="empty">아직 평가가 없습니다.</li>'}</ul>`;
  box.onclick = async e => { const b = e.target.closest('[data-hide]'); if (!b) return; try { await API.aReviewHide(AP(), +b.dataset.hide, b.dataset.h === '1'); aReviews(box); } catch (err) { aFail(err); } };
}
async function aTask(box) {
  box.innerHTML = '<p class="empty">불러오는 중입니다…</p>';
  let rows; try { rows = await API.aTasks(AP()); } catch (e) { return aFail(e); }
  const t = rows.find(r => r.code === TASK) || { code: TASK, title: D.title, lesson_url: '', submit_open: true, review_open: false, auto_public: false, open_stage: 2 };
  const ST = [[1, '1단계까지 — 압력 (미션 1)'], [2, '2단계까지 — 압력과 부피 (미션 2)'], [3, '3단계까지 — 온도와 부피 (미션 3)'], [4, '4단계 모두 — 최종본']];
  box.innerHTML = `<form class="sform" id="tf"><div class="field"><label>과제 이름</label><input type="text" id="tt" maxlength="60" value="${esc(t.title)}"></div>
    <div class="field"><label>수업 페이지 주소 <small>(https://… — 학생의 「내 모델」 화면에 「수업 페이지 열기」로 나옵니다)</small></label><input type="url" id="tl" value="${esc(t.lesson_url || '')}" placeholder="https://scienceisjo.github.io/…"></div>
    ${TASK !== 'gas' ? '' : `<div class="field"><label for="to">열린 단계 <small>(학생에게 열리는 곳 — 수업 페이지 「따라 하기」·미션 3·만들기 탭과 이 사이트의 「무엇을 올리나요?」(미션 3·최종본)가 함께 따릅니다)</small></label><select id="to">${ST.map(([v, lb]) => `<option value="${v}"${(+t.open_stage || 2) === v ? ' selected' : ''}>${lb}</option>`).join('')}</select></div>`}
    <label class="check"><input type="checkbox" id="ts"${t.submit_open ? ' checked' : ''}> 올리기 받기</label>
    <label class="check"><input type="checkbox" id="tr"${t.review_open ? ' checked' : ''}> 서로 평가 열기</label>
    <label class="check"><input type="checkbox" id="ta"${t.auto_public ? ' checked' : ''}> 올리자마자 공개(선생님 확인 건너뛰기)</label>
    <button class="btn primary" type="submit">저장</button></form>
    <p class="hint">학생용 주소: <b>${esc(location.origin + location.pathname)}</b>${TASK !== 'gas' ? '?t=' + esc(TASK) : ''}</p>`;
  $('#tf').onsubmit = async e => { e.preventDefault();
    const nt = { code: TASK, title: $('#tt').value.trim() || D.title, lesson_url: $('#tl').value.trim(), submit_open: $('#ts').checked, review_open: $('#tr').checked, auto_public: $('#ta').checked, open_stage: $('#to') ? +$('#to').value : (+t.open_stage || 4) };
    if (nt.lesson_url && !/^https:\/\/\S+$/.test(nt.lesson_url)) return toast('수업 페이지 주소는 https:// 로 시작해야 합니다.', true);
    try { await API.aTaskSave(AP(), nt); S.task = null; toast('저장했습니다.'); } catch (err) { aFail(err); } };
}
function aPass(box) {
  box.innerHTML = `<form class="sform" id="pf" autocomplete="off"><div class="field"><label>지금 비밀번호</label><input type="password" id="po" required></div><div class="field"><label>새 비밀번호 <small>(6자 이상)</small></label><input type="password" id="pn" required></div><button class="btn primary" type="submit">바꾸기</button></form>`;
  $('#pf').onsubmit = async e => { e.preventDefault(); try { await API.setPass($('#po').value, $('#pn').value); sset('sgh:ap', $('#pn').value); toast('비밀번호를 바꿨습니다.'); } catch (err) { toast(err.message, true); } };
}

/* ════════ 시작 ════════ */
if (LOCAL) $('#localbar').hidden = false;
drawWho();
$('#swtask').href = otherTask.href; $('#swtask').textContent = (otherTask.key === 'boyle' ? '🔬 ' : '🧪 ') + otherTask.name;
(async () => { try { await loadTask(); if (S.tok) await loadMe(); } catch (e) {} route(); })();
</script>
